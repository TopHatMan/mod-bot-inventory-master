name: Finalize bulk safety

on:
  push:
    branches:
      - agent/bulk-inventory-cleanup
    paths:
      - scripts/finalize_bulk_safety.py
      - .github/workflows/finalize-bulk-safety.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bulk-inventory-cleanup
      - run: python scripts/finalize_bulk_safety.py
      - name: Commit safety pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mod_bot_inventory_master.cpp BotInventoryMasterUI/BotInventoryMasterUI.lua README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Harden bulk inventory cleanup protections"
          git push origin HEAD:agent/bulk-inventory-cleanup
