name: Fix bulk compile order

on:
  push:
    branches:
      - agent/bulk-inventory-cleanup
    paths:
      - scripts/fix_bulk_compile_order.py
      - .github/workflows/fix-bulk-compile-order.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bulk-inventory-cleanup
      - run: python scripts/fix_bulk_compile_order.py
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mod_bot_inventory_master.cpp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix bulk cleanup helper declaration order"
          git push origin HEAD:agent/bulk-inventory-cleanup
