name: Fix bulk addon scope

on:
  push:
    branches:
      - agent/bulk-inventory-cleanup
    paths:
      - scripts/fix_bulk_addon_scope.py
      - .github/workflows/fix-bulk-addon-scope.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bulk-inventory-cleanup
      - run: python scripts/fix_bulk_addon_scope.py
      - name: Commit addon fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BotInventoryMasterUI/BotInventoryMasterUI.lua
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix bulk addon callback scope"
          git push origin HEAD:agent/bulk-inventory-cleanup
