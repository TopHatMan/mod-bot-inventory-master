name: Add party-wide inventory view

on:
  push:
    branches:
      - agent/bulk-inventory-cleanup
    paths:
      - scripts/add_party_bulk_inventory_view.py
      - .github/workflows/add-party-bulk-inventory-view.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bulk-inventory-cleanup
      - run: python scripts/add_party_bulk_inventory_view.py
      - name: Commit party-wide view
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mod_bot_inventory_master.cpp BotInventoryMasterUI/BotInventoryMasterUI.lua README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add party-wide bulk inventory view"
          git push origin HEAD:agent/bulk-inventory-cleanup
