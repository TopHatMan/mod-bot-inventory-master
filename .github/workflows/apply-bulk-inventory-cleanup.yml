name: Apply bulk inventory cleanup patch

on:
  workflow_dispatch:
  push:
    branches:
      - agent/bulk-inventory-cleanup
    paths:
      - scripts/apply_bulk_inventory_cleanup.py
      - .github/workflows/apply-bulk-inventory-cleanup.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bulk-inventory-cleanup
      - name: Disambiguate target parser marker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_bulk_inventory_cleanup.py')
          s = p.read_text(encoding='utf-8')
          old = '''    count = text.count(old)\n    if count != 1:\n        raise RuntimeError(f"{label}: expected exactly one match, found {count}")\n    return text.replace(old, new, 1)\n'''
          new = '''    count = text.count(old)\n    # The target and party parsers intentionally share the same destroy-gray prefix.\n    # For the target-only bulk insertion, the first occurrence is the target block.\n    if label == "cpp destroybatch parser":\n        if count < 1:\n            raise RuntimeError(f"{label}: expected at least one match, found {count}")\n        return text.replace(old, new, 1)\n    if count != 1:\n        raise RuntimeError(f"{label}: expected exactly one match, found {count}")\n    return text.replace(old, new, 1)\n'''
          if old not in s:
              raise SystemExit('replace_once helper marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply source/addon patch
        run: python scripts/apply_bulk_inventory_cleanup.py
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet -- src/mod_bot_inventory_master.cpp BotInventoryMasterUI/BotInventoryMasterUI.lua conf/BotInventoryMaster.conf.dist README.md; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mod_bot_inventory_master.cpp BotInventoryMasterUI/BotInventoryMasterUI.lua conf/BotInventoryMaster.conf.dist README.md
          git commit -m "Add bulk inventory cleanup and quality sorting"
          git push origin HEAD:agent/bulk-inventory-cleanup
