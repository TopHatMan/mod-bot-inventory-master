name: Apply SendBags declaration fix

on:
  push:
    branches:
      - agent/fix-sendbags-forward-declaration

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-sendbags-forward-declaration
      - name: Add missing forward declaration
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/mod_bot_inventory_master.cpp')
          text = path.read_text()
          old = '''    static bool IsTradeDistanceOk(Player* a, WorldObject* b);\n    static Creature* GetSelectedVendor(ChatHandler* handler, Player* manager, std::string& reason);\n'''
          new = '''    static bool IsTradeDistanceOk(Player* a, WorldObject* b);\n    static Creature* GetSelectedVendor(ChatHandler* handler, Player* manager, std::string& reason);\n    static void SendBags(ChatHandler* handler, Player* manager, Player* target);\n'''
          if old not in text:
              raise SystemExit('forward declaration anchor not found')
          if 'static void SendBags(ChatHandler* handler, Player* manager, Player* target);' not in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
      - name: Commit fix
        run: |
          git config user.name "TopHatMan"
          git config user.email "36683809+TopHatMan@users.noreply.github.com"
          git add src/mod_bot_inventory_master.cpp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix SendBags declaration order"
          git push origin HEAD:agent/fix-sendbags-forward-declaration
