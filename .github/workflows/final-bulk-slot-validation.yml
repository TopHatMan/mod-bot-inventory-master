name: Final bulk bag-slot validation

on:
  push:
    branches:
      - agent/bulk-inventory-cleanup
    paths:
      - scripts/final_bulk_slot_validation.py
      - .github/workflows/final-bulk-slot-validation.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bulk-inventory-cleanup
      - run: python scripts/final_bulk_slot_validation.py
      - name: Commit validation fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mod_bot_inventory_master.cpp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restrict bulk cleanup to bag storage slots"
          git push origin HEAD:agent/bulk-inventory-cleanup
